<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ pais.name }}
    </title>


    <style>

        body {

            font-family: Arial, sans-serif;

            background-color: #f2f2f2;

            margin: 0;

            padding: 0;
        }


        .contenedor {

            width: 80%;

            max-width: 800px;

            margin: 40px auto;

            background-color: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 0 10px
                rgba(0, 0, 0, 0.15);
        }


        h1 {

            text-align: center;

            color: #333;
        }


        .bandera {

            text-align: center;

            font-size: 80px;

            margin: 20px;
        }


        .informacion {

            margin-top: 20px;
        }


        .dato {

            padding: 12px;

            border-bottom: 1px solid #ddd;
        }


        .dato strong {

            display: inline-block;

            width: 180px;
        }


        .botones {

            margin-top: 30px;

            text-align: center;
        }


        .botones a {

            display: inline-block;

            padding: 12px 20px;

            margin: 5px;

            background-color: #333;

            color: white;

            text-decoration: none;

            border-radius: 5px;
        }


        .botones a:hover {

            background-color: #555;
        }

    </style>

</head>


<body>


<div class="contenedor">


<!-- Encabezado del país -->
<div style="text-align: center;">

    <!-- Bandera -->

    {% if pais.flags and pais.flags.png %}

        <img
            src="{{ pais.flags.png }}"
            alt="Bandera de {{ pais.name }}"
            style="
                width: 100%;
                height: auto;
                display: block;
            "
        >

    {% endif %}

    <!-- Nombre del país -->
    <h1 style="
        font-size: 40px;
        margin: 20px 0 30px 0;
    ">
        {{ pais.name }}
    </h1>

</div>


    <!-- ========================================= -->
    <!-- INFORMACIÓN DEL PAÍS -->
    <!-- ========================================= -->

    <div class="informacion">


        <div class="dato">

            <strong>
                Capital:
            </strong>

            {{ pais.capital }}

        </div>


        <div class="dato">

            <strong>
                Región:
            </strong>

            {{ pais.region }}

        </div>


        <div class="dato">

            <strong>
                Subregión:
            </strong>

            {{ pais.subregion }}

        </div>


        <div class="dato">

            <strong>
                Código ISO:
            </strong>

            {{ pais.alpha3Code }}

        </div>

        <!-- ===================================== -->
        <!-- MAPA -->
        <!-- ===================================== -->

        {% if pais.maps and pais.maps.googleMaps %}

            <div class="dato">

                <strong>
                    Ubicación:
                </strong>

                <a
                    href="{{ pais.maps.googleMaps }}"
                    target="_blank"
                >

                    📍 Ver en Google Maps

                </a>

            </div>

        {% endif %}


    <!-- ========================================= -->
    <!-- BOTONES -->
    <!-- ========================================= -->

    <div class="botones">

        <a href="/">
            ← Volver a países
        </a>


        
    </div>


</div>


</body>

</html>
